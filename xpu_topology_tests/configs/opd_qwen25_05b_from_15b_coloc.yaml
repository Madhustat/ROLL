# Derived from examples/distill/on_policy/llm/onpolicy_distill_config.yaml for 2 XPUs:
# student Qwen2.5-0.5B-Instruct (FSDP2 on XPU0, vLLM on XPU1), teacher Qwen2.5-1.5B-Instruct (hf_infer on XPU0),
# local math data from the NVIDIA bring-up recipe, no sequence packing (Megatron-only), 4 smoke steps.
hydra:
  run:
    dir: .
  output_subdir: null

exp_name: "xpu_opd_coloc"
output_dir: ${oc.env:ROLL_WORK}/output
logging_dir: ${oc.env:ROLL_WORK}/output/logs
rollout_dump_dir: ${oc.env:ROLL_WORK}/output/rollout_dump
seed: 42
system_envs:
  USE_MODELSCOPE: '0'
checkpoint_config:
  type: file_system
  output_dir: ${oc.env:ROLL_WORK}/checkpoints/xpu_opd
track_with: tensorboard
tracker_kwargs:
  log_dir: ${oc.env:ROLL_WORK}/tensorboard/xpu_opd

transfer_backend:
  backend_name: null

num_nodes: 1
num_gpus_per_node: 2
max_steps: 4
save_steps: 10000
logging_steps: 1
eval_steps: 100
resume_from_checkpoint: false

rollout_batch_size: 8
prompt_length: 512
response_length: 512
num_return_sequences_in_group: 4
ppo_epochs: 1
adv_estimator: "reinforce"

pretrain: ${oc.env:ROLL_WORK}/models/Qwen2.5-0.5B-Instruct
reward_pretrain: ${oc.env:ROLL_WORK}/models/Qwen2.5-0.5B-Instruct
global_template: qwen2_5

student_train:
  model_args:
    model_name_or_path: ${pretrain}
    attn_implementation: sdpa
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: ~
  training_args:
    learning_rate: 5.0e-7
    weight_decay: 0.1
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 4
    warmup_steps: 0
    num_train_epochs: 50
  data_args:
    file_name:
      - ${oc.env:ROLL_REPO}/data/math_deepmath_deal.jsonl
    domain_interleave_probs:
      math_rule: 1.0
    messages: messages
    interleave_probs: "1.0"
    preprocessing_num_workers: 4
  strategy_args:
    strategy_name: fsdp2_train
    strategy_config:
      enable_mix_precision: true
      reshard_after_forward: true
      offload_policy: false
  device_mapping: list(range(0,1))
  infer_batch_size: 4

student_infer:
  model_args:
    model_name_or_path: ${pretrain}
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: ${response_length}
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.99
    num_return_sequences: ${num_return_sequences_in_group}
  strategy_args:
    strategy_name: vllm
    strategy_config:
      gpu_memory_utilization: 0.4
      block_size: 16
      max_model_len: 1024
  device_mapping: list(range(0,1))
  infer_batch_size: 1

teacher:
  model_args:
    model_name_or_path: ${oc.env:ROLL_WORK}/models/Qwen2.5-1.5B-Instruct
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: ~
  strategy_args:
    strategy_name: hf_infer
    strategy_config: ~
  device_mapping: list(range(0,1))
  infer_batch_size: 2

rewards:
  math_rule:
    worker_cls: roll.pipeline.rlvr.rewards.math_rule_reward_worker.MathRuleRewardWorker
    model_args:
      model_name_or_path: ${reward_pretrain}
    data_args:
      template: qwen2_5
    tag_included: [deepmath_103k]
    world_size: 1
    infer_batch_size: 1
