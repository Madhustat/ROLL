# Derived from examples/qwen2_5-vl-3B-rlvr_fsdp2/rlvr_fsdp2_offload.yaml for 2 XPUs (32 GB each):
# math domain only (mm_math parquet), training + reference on XPU0 with FSDP2 CPU offload, vLLM on XPU1, sdpa instead of fa2, 4 smoke steps.
hydra:
  run:
    dir: .
  output_subdir: null

exp_name: "xpu_vl3b_math"
seed: 42
logging_dir: ${oc.env:ROLL_WORK}/output/logs
output_dir: ${oc.env:ROLL_WORK}/output
checkpoint_config:
  type: file_system
  output_dir: ${oc.env:ROLL_WORK}/checkpoints/xpu_vl3b_math
track_with: tensorboard
tracker_kwargs:
  log_dir: ${oc.env:ROLL_WORK}/tensorboard/xpu_vl3b_math

transfer_backend:
  backend_name: null

num_nodes: 1
num_gpus_per_node: 2

max_steps: 4
save_steps: 0
logging_steps: 1
eval_steps: 100
resume_from_checkpoint: false

rollout_batch_size: 8
num_return_sequences_in_group: 4
is_num_return_sequences_expand: true
prompt_length: 1024
response_length: 512
ppo_epochs: 1
value_clip: 0.5
reward_clip: 10
advantage_clip: 10.0
whiten_advantages: false
init_kl_coef: 0.0
adv_estimator: "grpo"
use_kl_loss: true
kl_loss_coef: 1.0e-2

pretrain: ${oc.env:ROLL_WORK}/models/Qwen2.5-VL-3B-Instruct

actor_train:
  model_args:
    attn_implementation: sdpa
    model_name_or_path: ${pretrain}
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: ~
    freeze_module_prefix: model.visual
  training_args:
    learning_rate: 1.0e-6
    weight_decay: 1.0e-2
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 8
    warmup_steps: 0
    num_train_epochs: 50
  data_args:
    file_name:
      - ${oc.env:ROLL_WORK}/data/orsta/train/train_math_mmmath_3539.parquet
    domain_interleave_probs:
      math: 1.0
    dataset_dir: ./
    messages: prompt
    preprocessing_num_workers: 4
  strategy_args:
    strategy_name: fsdp2_train
    strategy_config:
      enable_mix_precision: true
      reshard_after_forward: true
      offload_policy: true
      use_batched_model_update: false
  device_mapping: list(range(0,1))
  infer_batch_size: 1

actor_infer:
  model_args:
    attn_implementation: sdpa
    model_name_or_path: ${pretrain}
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: ${response_length}
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.99
    num_return_sequences: ${num_return_sequences_in_group}
  strategy_args:
    strategy_name: vllm
    strategy_config:
      gpu_memory_utilization: 0.5
      block_size: 16
      max_model_len: 2048
  num_gpus_per_worker: 1
  device_mapping: list(range(1,2))
  infer_batch_size: 4

reference:
  model_args:
    attn_implementation: sdpa
    model_name_or_path: ${pretrain}
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: ~
  strategy_args:
    strategy_name: hf_infer
    strategy_config: ~
  device_mapping: list(range(0,1))
  infer_batch_size: 1

rewards:
  math:
    worker_cls: roll.pipeline.rlvr.rewards.math_rule_reward_worker.MathRuleRewardWorker
    model_args:
      model_name_or_path: ${pretrain}
    tag_included: [mm_math, megabench_math]
    world_size: 1
    infer_batch_size: 1
