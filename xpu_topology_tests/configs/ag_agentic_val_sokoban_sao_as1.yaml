defaults:
- ../config/traj_envs@_here_
hydra:
  run:
    dir: .
  output_subdir: null
exp_name: xpu_ag_sokoban_sao_as1
seed: 42
logging_dir: ${oc.env:ROLL_WORK}/output/logs
output_dir: ${oc.env:ROLL_WORK}/output
render_save_dir: ${oc.env:ROLL_WORK}/render
system_envs:
  USE_MODELSCOPE: '0'
track_with: tensorboard
tracker_kwargs:
  log_dir: ${oc.env:ROLL_WORK}/tensorboard/xpu_ag_sokoban_sao_as1
checkpoint_config:
  type: file_system
  output_dir: ${oc.env:ROLL_WORK}/checkpoints/agentic_frozen_lake
num_gpus_per_node: 2
max_steps: 6
save_steps: 10000
logging_steps: 1
eval_steps: 10
resume_from_checkpoint: false
rollout_batch_size: 16
val_batch_size: 16
sequence_length: 4096
advantage_clip: 2.0
ppo_epochs: 1
adv_estimator: skip_obs_gae
init_kl_coef: 0.2
whiten_advantages: true
entropy_loss_coef: 0
max_grad_norm: 1.0
pretrain: ${oc.env:ROLL_WORK}/models/Qwen2.5-0.5B-Instruct
reward_pretrain: ${oc.env:ROLL_WORK}/models/Qwen2.5-0.5B-Instruct
actor_train:
  model_args:
    attn_implementation: sdpa
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: null
  training_args:
    learning_rate: 1.0e-06
    weight_decay: 0
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 16
    warmup_steps: 10
    lr_scheduler_type: cosine
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: fsdp2_train
    strategy_config:
      enable_mix_precision: true
      reshard_after_forward: true
      offload_policy: false
  device_mapping: list(range(0,1))
  infer_batch_size: 1
  worker_cls: roll.pipeline.agentic.agentic_actor_pg_worker.ActorWorker
  pg_variant: sao
  sao_epsilon_low: 0.3
  sao_epsilon_high: 5.0
actor_infer:
  model_args:
    attn_implementation: sdpa
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: 32
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.99
    num_return_sequences: 1
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: vllm
    strategy_config:
      gpu_memory_utilization: 0.4
      block_size: 16
      load_format: auto
  device_mapping: list(range(1,2))
  infer_batch_size: 1
reference:
  model_args:
    attn_implementation: sdpa
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: null
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: hf_infer
    strategy_config: null
  device_mapping: list(range(0,1))
  infer_batch_size: 1
reward_normalization:
  grouping: batch
  method: identity
train_env_manager:
  format_penalty: -0.15
  max_env_num_per_worker: 16
  num_env_groups: 1
  group_size: 1
  tags:
  - SimpleSokoban
  num_groups_partition:
  - 1
val_env_manager:
  max_env_num_per_worker: 1
  num_env_groups: 2
  group_size: 1
  tags:
  - SimpleSokoban
  - LargerSokoban
  num_groups_partition:
  - 1
  - 1
max_tokens_per_step: 64
custom_envs:
  SimpleSokoban: ${custom_env.SimpleSokoban}
  LargerSokoban: ${custom_env.LargerSokoban}
  SokobanDifferentGridVocab: ${custom_env.SokobanDifferentGridVocab}
  FrozenLake: ${custom_env.FrozenLake}
partial_gpu_mode: false
async_generation_ratio: 1
use_kl_loss: false
kl_loss_coef: 0.001
loss_agg_mode: seq-mean-token-mean
reward_clip: 10
dual_clip_loss: false
lambd: 1
gamma: 1
pg_clip: 0.2
value_clip: null
kl_penalty: kl
kl_horizon: 10000
add_token_level_kl: false
critic_epochs: 2
critic_warmup: 50
critic:
  model_args:
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: trl
    freeze_module_contains: self_attn
    attn_implementation: sdpa
  training_args:
    learning_rate: 1.0e-05
    weight_decay: 0
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 16
    warmup_steps: 0
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: fsdp2_train
    strategy_config:
      enable_mix_precision: true
      reshard_after_forward: true
      offload_policy: false
      wrap_policy:
        transformer_layer_cls_to_wrap:
        - Qwen2DecoderLayer
  device_mapping: list(range(0,1))
  infer_batch_size: 1
