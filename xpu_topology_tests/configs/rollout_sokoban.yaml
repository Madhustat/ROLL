defaults:
- ../config/traj_envs@_here_
hydra:
  run:
    dir: .
  output_subdir: null
exp_name: xpu_agentic_rollout_sokoban
seed: 42
render_save_dir: ${oc.env:ROLL_WORK}/render
track_with: tensorboard
tracker_kwargs:
  log_dir: ${oc.env:ROLL_WORK}/tensorboard/xpu_agentic_rollout
num_gpus_per_node: 2
max_steps: 4
save_steps: 10000
rollout_batch_size: 16
sequence_length: 8192
pretrain: ${oc.env:ROLL_WORK}/models/Qwen2.5-0.5B-Instruct
actor_infer:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: 128
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.99
    num_return_sequences: 1
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: vllm
    strategy_config:
      gpu_memory_utilization: 0.4
      block_size: 16
      load_format: auto
  device_mapping: list(range(0,2))
train_env_manager:
  format_penalty: -0.15
  max_env_num_per_worker: 16
  num_env_groups: 1
  group_size: 1
  tags:
  - SimpleSokoban
  num_groups_partition:
  - 1
max_tokens_per_step: 64
custom_envs:
  SimpleSokoban: ${custom_env.SimpleSokoban}
  LargerSokoban: ${custom_env.LargerSokoban}
  SokobanDifferentGridVocab: ${custom_env.SokobanDifferentGridVocab}
  FrozenLake: ${custom_env.FrozenLake}
  FrozenLakeThink: ${custom_env.FrozenLakeThink}
logging_dir: ${oc.env:ROLL_WORK}/output/logs
output_dir: ${oc.env:ROLL_WORK}/output
system_envs:
  USE_MODELSCOPE: '0'
