hydra:
  run:
    dir: .
  output_subdir: null
exp_name: xpu_ex_ex_ppo
seed: 42
logging_dir: __OUT_DIR__/output/logs
output_dir: __OUT_DIR__/output
system_envs:
  USE_MODELSCOPE: '0'
checkpoint_config:
  type: file_system
  output_dir: __OUT_DIR__/checkpoints/xpu_ex_ex_ppo
track_with: tensorboard
tracker_kwargs:
  log_dir: __OUT_DIR__/tensorboard/xpu_ex_ex_ppo
num_gpus_per_node: 2
max_steps: 4
save_steps: 10000
logging_steps: 1
eval_steps: 10000
resume_from_checkpoint: false
rollout_batch_size: 8
prompt_length: 512
response_length: 512
adv_estimator: gae
num_return_sequences_in_group: 1
ppo_epochs: 1
use_kl_loss: true
kl_loss_coef: 0.001
loss_agg_mode: seq-mean-token-mean
whiten_advantages: true
advantage_clip: 2.0
reward_clip: 10
dual_clip_loss: true
lambd: 0.95
gamma: 1
pg_clip: 0.2
value_clip: null
kl_penalty: kl
target_kl: null
init_kl_coef: 0.2
kl_horizon: 10000
add_token_level_kl: false
reward_norm: null
reward_shift: false
reward_scale: false
pretrain: __MODELS_DIR__/Qwen2.5-0.5B-Instruct
reward_pretrain: __MODELS_DIR__/Qwen2.5-0.5B-Instruct
validation:
  data_args:
    template: qwen2_5
    file_name:
    - data/math_benchmarks.jsonl
  generating_args:
    max_new_tokens: ${response_length}
    top_p: 0.6
    top_k: 50
    num_beams: 1
    temperature: 0.6
    num_return_sequences: 1
actor_train:
  model_args:
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: null
  training_args:
    learning_rate: 1.0e-06
    weight_decay: 0
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 4
    warmup_steps: 0
  data_args:
    template: qwen2_5
    file_name:
    - data/math_deepmath_deal.jsonl
    domain_interleave_probs:
      math_rule: 1.0
    dataset_dir: data
    messages: messages
    interleave_probs: '1.0'
    preprocessing_num_workers: 4
  strategy_args:
    strategy_name: fsdp2_train
    strategy_config:
      enable_mix_precision: true
      reshard_after_forward: true
      offload_policy: false
  device_mapping: list(range(0,1))
  infer_batch_size: 4
actor_infer:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: ${response_length}
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.99
    num_return_sequences: ${num_return_sequences_in_group}
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: vllm
    strategy_config:
      gpu_memory_utilization: 0.4
      block_size: 16
      max_model_len: 1024
      load_format: auto
  device_mapping: list(range(1,2))
  infer_batch_size: 1
reference:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: null
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: fsdp2_infer
    strategy_config:
      reshard_after_forward: true
  device_mapping: list(range(0,1))
  infer_batch_size: 4
critic:
  model_args:
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: trl
  training_args:
    learning_rate: 1.0e-05
    weight_decay: 0
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 4
    warmup_steps: 0
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: fsdp2_train
    strategy_config:
      enable_mix_precision: true
      reshard_after_forward: true
      offload_policy: false
      wrap_policy:
        transformer_layer_cls_to_wrap:
        - Qwen2DecoderLayer
  device_mapping: list(range(0,1))
  infer_batch_size: 4
rewards:
  math_rule:
    worker_cls: roll.pipeline.rlvr.rewards.math_rule_reward_worker.MathRuleRewardWorker
    model_args:
      model_name_or_path: __MODELS_DIR__/Qwen2.5-0.5B-Instruct
    data_args:
      template: qwen2_5
    tag_included:
    - deepmath_103k
    - aime
    world_size: 1
    infer_batch_size: 1
num_nodes: 1
