# Variant B1_onedevice = rlvr_grpo_qwen2.5-0.5b_2xpu_bringup.yaml + {'actor_train.device_mapping': 'list(range(0,1))', 'actor_infer.device_mapping': 'list(range(0,1))', 'reference.device_mapping': 'list(range(0,1))'} (+ exp_name). Generated 2026-11-02.
hydra:
  run:
    dir: .
  output_subdir: null
exp_name: devctl_grpo_1xpu_colocated
seed: 42
logging_dir: ${oc.env:ROLL_WORK}/output/logs
output_dir: ${oc.env:ROLL_WORK}/output
model_download_type: HUGGINGFACE_HUB
checkpoint_config:
  type: file_system
  output_dir: ${oc.env:ROLL_WORK}/checkpoints/${exp_name}
track_with: tensorboard
tracker_kwargs:
  log_dir: ${oc.env:ROLL_WORK}/tensorboard
transfer_backend:
  backend_name: null
num_nodes: 1
num_gpus_per_node: 2
max_steps: 4
save_steps: 0
logging_steps: 1
eval_steps: 100
resume_from_checkpoint: false
rollout_batch_size: 8
num_return_sequences_in_group: 4
prompt_length: 512
response_length: 512
ppo_epochs: 1
adv_estimator: grpo
init_kl_coef: 0.0
use_kl_loss: true
kl_loss_coef: 0.001
reward_clip: 10
advantage_clip: 2.0
dual_clip_loss: true
pretrain: ${oc.env:ROLL_WORK}/models/Qwen2.5-0.5B-Instruct
reward_pretrain: ${oc.env:ROLL_WORK}/models/Qwen2.5-0.5B-Instruct
actor_train:
  model_args:
    disable_gradient_checkpointing: false
    dtype: bf16
  training_args:
    learning_rate: 1.0e-06
    weight_decay: 0
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 4
    warmup_steps: 0
    num_train_epochs: 1
  data_args:
    template: qwen2_5
    file_name:
    - ${oc.env:ROLL_REPO}/data/math_deepmath_deal.jsonl
    domain_interleave_probs:
      math_rule: 1.0
    messages: messages
    interleave_probs: '1.0'
    preprocessing_num_workers: 4
  strategy_args:
    strategy_name: fsdp2_train
    strategy_config:
      enable_mix_precision: true
      reshard_after_forward: true
      offload_policy: false
  device_mapping: list(range(0,1))
  infer_batch_size: 4
actor_infer:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: ${response_length}
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.99
    num_return_sequences: ${num_return_sequences_in_group}
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: vllm
    strategy_config:
      gpu_memory_utilization: 0.4
      block_size: 16
      max_model_len: 1024
  device_mapping: list(range(0,1))
  infer_batch_size: 1
reference:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: fsdp2_infer
    strategy_config:
      reshard_after_forward: true
  device_mapping: list(range(0,1))
  infer_batch_size: 4
rewards:
  math_rule:
    worker_cls: roll.pipeline.rlvr.rewards.math_rule_reward_worker.MathRuleRewardWorker
    model_args:
      model_name_or_path: ${reward_pretrain}
    data_args:
      template: qwen2_5
    tag_included:
    - deepmath_103k
    world_size: 1
    infer_batch_size: 1
